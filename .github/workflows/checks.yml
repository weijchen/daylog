name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite
        run: sh tests/run.sh

  # Kept as its own step so a manifest divergence names itself in the job list
  # rather than hiding inside a generic test failure.
  plugin-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # jq ships with the ubuntu-latest image today, so this is a no-op on the
      # normal path — it exists so the check keeps working if that ever stops
      # being true, without paying an apt round-trip on every run (SP-854).
      - name: Ensure jq is available
        run: command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }

      - name: plugin.json / marketplace.json agree
        run: sh scripts/check-plugin-metadata.sh
